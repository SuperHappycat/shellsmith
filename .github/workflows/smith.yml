name: smith

# Every push runs the Shellsmith tester against your shell and republishes your dashboard.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: smith-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Go, Rust (cargo) and Node.js are preinstalled on GitHub's Ubuntu runners.
      # C needs the GNU readline headers for the line-editing stages.
      - name: Install C readline headers
        if: hashFiles('app/*.c') != ''
        run: sudo apt-get install -y -qq libreadline-dev

      # Uses Ubuntu's own python3, which ships with GNU readline (needed for the TAB stages).
      - name: Run the tester
        env:
          SMITH_TIMEOUT: "6"
          SMITH_JOBS: "4"
        run: |
          chmod +x your_shell.sh
          python3 tester/run.py --json results.json || true

      - name: Write run summary
        run: python3 scripts/build_site.py --summary results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Build dashboard
        run: python3 scripts/build_site.py --results results.json --out _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
